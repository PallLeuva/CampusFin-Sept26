# ============================================================
# CampusFin Local Development Database
# ============================================================
#
# This configuration uses the existing H2 database.
#
# It allows local development to continue exactly as before.
# ============================================================


spring.datasource.url=jdbc:h2:file:./data/campusfin

spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.username=sa

spring.datasource.password=


# ============================================================
# H2 Console
# ============================================================

spring.h2.console.enabled=true

spring.h2.console.path=/h2-console