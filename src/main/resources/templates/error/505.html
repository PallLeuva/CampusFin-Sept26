<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something Went Wrong | CampusFin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow-sm border-0">

                <div class="card-body p-5 text-center">

                    <h1 class="display-4 fw-bold">
                        500
                    </h1>

                    <h2 class="h4 mb-3">
                        Something Went Wrong
                    </h2>

                    <p class="text-secondary">
                        CampusFin encountered an unexpected problem while
                        processing your request.
                    </p>

                    <p class="text-muted small">
                        Your saved profile data should remain available.
                        Try returning to the homepage and continuing from there.
                    </p>

                    <a
                        href="/"
                        class="btn btn-primary mt-3">

                        Return to CampusFin Home

                    </a>

                </div>

            </div>

        </div>

    </div>

</main>

</body>

</html>
